# What corpus.sh needs of Porelo's own Maven repositories: Maven's, with the command their Build runs, which reads the
# settings file checked in beside the pom.
. "$(dirname "$(realpath "${BASH_SOURCE[0]}")")/maven.conf"
build_command() {
    case $2 in skip-tests) echo "sh ./mvnw -B -s settings.xml verify -DskipTests";; tests) echo "sh ./mvnw -B -s settings.xml verify";; esac
}
# Each carries the porelo.yml it is built with, which Porelo would read instead of asking the adapter.
prepare_checkout() {
    [ ! -e "$1/porelo.yml" ] || git -C "$1" -c user.name=corpus -c user.email=corpus@localhost -c commit.gpgsign=false rm -q porelo.yml
    git -C "$1" -c user.name=corpus -c user.email=corpus@localhost -c commit.gpgsign=false commit -q --allow-empty -m "corpus: as a checkout Porelo has not seen"
}
# Their Spotless checks shell scripts with shfmt from the path, as the person building has it: exactly the version
# porelo-parent pins, checked against the digest its release names.
SHFMT=https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64
SHFMT_SHA256=d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea
eval "maven_$(declare -f reference_setup)"
# Their document checks list the checkout's files with git, as the person's machine has it.
reference_setup() { echo "$(maven_reference_setup "$1") && apt-get install -y -qq --no-install-recommends git >/dev/null && curl -fsSL -o /usr/local/bin/shfmt $SHFMT && echo '$SHFMT_SHA256  /usr/local/bin/shfmt' | sha256sum -c - && chmod 0755 /usr/local/bin/shfmt"; }
