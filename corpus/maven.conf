# What corpus.sh needs of Maven.
# 26.04, as Ubuntu 24.04 packages Maven 3.8.7, too old for many projects: the reference must not fail for that.
REFERENCE_IMAGE=docker.io/library/ubuntu:26.04
CACHE_MOUNT=$HOME/.m2:/root/.m2
mkdir -p "$HOME/.m2"
reference_setup() { echo "apt-get update -qq >/dev/null && apt-get install -y -qq --no-install-recommends openjdk-$1-jdk-headless maven unzip curl >/dev/null && export JAVA_HOME=/usr/lib/jvm/java-$1-openjdk-\$(dpkg --print-architecture)"; }
build_command() {
    local tool='mvn'; [ -f "$1/mvnw" ] && tool='sh ./mvnw'
    case $2 in skip-tests) echo "$tool -B install -DskipTests";; tests) echo "$tool -B clean install";; esac
}
DOWNLOADED='Downloaded from [^:]+: https?://([^/:\s]+)'
# JAVA_HOME, where a plugin stops on it and a JDK stands in the task: the draft does not set it yet.
known_gap() {
    grep -qE '^\[ERROR\].*JAVA_HOME' "$1" || return 0
    local java
    java=$(podman exec "$2" sh -c 'readlink -f "$(command -v java)"') || return 0
    if [ -n "$java" ]; then echo "JAVA_HOME=$(dirname "$(dirname "$java")")"; fi
}
